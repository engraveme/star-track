[project]
name = "gitreview-gpt"
version = "0.1.4"
description = "CLI tool that reviews your git changes with GPT-3.5 and GPT-4"
authors = [{name = "fynnfluegge", email = "fynnfluegge@gmx.de"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tiktoken>=0.4.0",
    "yaspin>=2.3.0",
]

[project.scripts]
rgpt = "gitreview_gpt.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
